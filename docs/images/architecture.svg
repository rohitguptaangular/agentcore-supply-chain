<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Supply Chain Assistant on Amazon Bedrock AgentCore</title>
  <desc>Users reach a chat UI on CloudFront backed by a private S3 bucket. An HTTP API invokes a chat handler Lambda, which exchanges Cognito client credentials for a token and calls the orchestrator agent runtime. The orchestrator uses Nova Pro through a Bedrock guardrail, reads and writes AgentCore Memory, discovers tools from an AgentCore Gateway that fronts four domain Lambdas over seven DynamoDB tables, and delegates document questions over agent-to-agent invocation to a knowledge base specialist running Nova Lite against a Bedrock knowledge base stored in S3 Vectors.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8b3c2"/>
    </marker>
  </defs>

  <rect width="980" height="660" fill="#ffffff"/>

  <!-- ── title ───────────────────────────────────────────────────────── -->
  <text x="30" y="36" font-size="17" font-weight="600" fill="#0f172a">Supply Chain Assistant on Amazon Bedrock AgentCore</text>
  <text x="30" y="56" font-size="12" fill="#64748b">One Cognito identity is minted once and validated at every hop. Tools are discovered at runtime, not compiled in.</text>

  <!-- ── delivery band ───────────────────────────────────────────────── -->
  <text x="30" y="88" font-size="10" font-weight="600" letter-spacing="1.2" fill="#2563eb">DELIVERY</text>

  <rect x="30"  y="98" width="86"  height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="73"  y="128" font-size="12" text-anchor="middle" fill="#0f172a">Users</text>

  <rect x="150" y="98" width="116" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="208" y="121" font-size="12" text-anchor="middle" fill="#0f172a">CloudFront</text>
  <text x="208" y="136" font-size="10" text-anchor="middle" fill="#64748b">OAC + HTTPS</text>

  <rect x="298" y="98" width="112" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="354" y="121" font-size="12" text-anchor="middle" fill="#0f172a">S3</text>
  <text x="354" y="136" font-size="10" text-anchor="middle" fill="#64748b">private origin</text>

  <rect x="452" y="98" width="120" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="512" y="121" font-size="12" text-anchor="middle" fill="#0f172a">API Gateway</text>
  <text x="512" y="136" font-size="10" text-anchor="middle" fill="#64748b">POST /chat</text>

  <rect x="608" y="98" width="140" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="678" y="121" font-size="12" text-anchor="middle" fill="#0f172a">Lambda</text>
  <text x="678" y="136" font-size="10" text-anchor="middle" fill="#64748b">chat handler</text>

  <!-- identity -->
  <text x="790" y="88" font-size="10" font-weight="600" letter-spacing="1.2" fill="#7c3aed">IDENTITY</text>
  <rect x="790" y="98" width="160" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="870" y="121" font-size="12" text-anchor="middle" fill="#0f172a">Cognito</text>
  <text x="870" y="136" font-size="10" text-anchor="middle" fill="#64748b">machine-to-machine</text>

  <line x1="116" y1="123" x2="146" y2="123" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="266" y1="123" x2="294" y2="123" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="410" y1="123" x2="448" y2="123" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="572" y1="123" x2="604" y2="123" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="748" y1="123" x2="786" y2="123" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="767" y="114" font-size="9" text-anchor="middle" fill="#7c3aed">token</text>

  <!-- ── reasoning band ──────────────────────────────────────────────── -->
  <text x="30" y="196" font-size="10" font-weight="600" letter-spacing="1.2" fill="#059669">REASONING</text>

  <rect x="330" y="206" width="300" height="58" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="480" y="230" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">AgentCore Runtime — orchestrator</text>
  <text x="480" y="248" font-size="10" text-anchor="middle" fill="#64748b">Nova Pro · decides what to do</text>

  <!-- chat handler down into orchestrator -->
  <path d="M 678 148 L 678 178 L 480 178 L 480 202" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="560" y="172" font-size="9" text-anchor="middle" fill="#64748b">bearer token · qualifier DEFAULT</text>

  <!-- attachments -->
  <rect x="700" y="186" width="150" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="775" y="211" font-size="11" text-anchor="middle" fill="#0f172a">Bedrock Guardrails</text>

  <rect x="700" y="234" width="150" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="775" y="259" font-size="11" text-anchor="middle" fill="#0f172a">AgentCore Memory</text>

  <line x1="630" y1="223" x2="696" y2="206" stroke="#a8b3c2" stroke-width="1.1" marker-end="url(#arrowLight)"/>
  <line x1="630" y1="243" x2="696" y2="254" stroke="#a8b3c2" stroke-width="1.1" marker-end="url(#arrowLight)"/>

  <!-- ── knowledge branch (left) ─────────────────────────────────────── -->
  <text x="30" y="316" font-size="10" font-weight="600" letter-spacing="1.2" fill="#0891b2">KNOWLEDGE · unstructured</text>

  <path d="M 380 264 L 380 296 L 175 296 L 175 322" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="262" y="290" font-size="9" text-anchor="middle" fill="#0891b2">agent-to-agent</text>

  <rect x="60"  y="326" width="230" height="52" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/>
  <text x="175" y="348" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">AgentCore Runtime — KB specialist</text>
  <text x="175" y="365" font-size="10" text-anchor="middle" fill="#64748b">Nova Lite · retrieve and cite</text>

  <rect x="60"  y="410" width="230" height="46" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
  <text x="175" y="431" font-size="11" text-anchor="middle" fill="#0f172a">Bedrock Knowledge Base</text>
  <text x="175" y="446" font-size="9" text-anchor="middle" fill="#64748b">Titan Text Embeddings V2 · 1024-dim</text>

  <line x1="175" y1="378" x2="175" y2="406" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="60"  y="488" width="108" height="46" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
  <text x="114" y="509" font-size="11" text-anchor="middle" fill="#0f172a">S3 Vectors</text>
  <text x="114" y="524" font-size="9" text-anchor="middle" fill="#64748b">embeddings</text>

  <rect x="182" y="488" width="108" height="46" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
  <text x="236" y="509" font-size="11" text-anchor="middle" fill="#0f172a">S3</text>
  <text x="236" y="524" font-size="9" text-anchor="middle" fill="#64748b">documents</text>

  <line x1="130" y1="456" x2="118" y2="484" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="220" y1="456" x2="232" y2="484" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ── action branch (right) ───────────────────────────────────────── -->
  <text x="360" y="316" font-size="10" font-weight="600" letter-spacing="1.2" fill="#ea580c">ACTION · structured</text>

  <line x1="560" y1="264" x2="560" y2="322" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="606" y="294" font-size="9" text-anchor="middle" fill="#ea580c">MCP ListTools</text>

  <rect x="360" y="326" width="400" height="52" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="560" y="348" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">AgentCore Gateway</text>
  <text x="560" y="365" font-size="10" text-anchor="middle" fill="#64748b">12 tools · JWT in, IAM role out</text>

  <g font-size="10.5" text-anchor="middle" fill="#0f172a">
    <rect x="360" y="410" width="92" height="46" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
    <text x="406" y="431">inventory</text><text x="406" y="446" font-size="9" fill="#64748b">Lambda</text>

    <rect x="462" y="410" width="92" height="46" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
    <text x="508" y="431">supplier</text><text x="508" y="446" font-size="9" fill="#64748b">Lambda</text>

    <rect x="564" y="410" width="92" height="46" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
    <text x="610" y="431">logistics</text><text x="610" y="446" font-size="9" fill="#64748b">Lambda</text>

    <rect x="666" y="410" width="92" height="46" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
    <text x="712" y="431">quality</text><text x="712" y="446" font-size="9" fill="#64748b">Lambda</text>
  </g>

  <line x1="406" y1="378" x2="406" y2="406" stroke="#64748b" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="508" y1="378" x2="508" y2="406" stroke="#64748b" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="610" y1="378" x2="610" y2="406" stroke="#64748b" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="712" y1="378" x2="712" y2="406" stroke="#64748b" stroke-width="1.1" marker-end="url(#arrow)"/>

  <g font-size="9" text-anchor="middle" fill="#64748b">
    <rect x="360" y="488" width="92" height="46" rx="6" fill="#fdf2f8" stroke="#be185d" stroke-width="1.1"/>
    <text x="406" y="508" font-size="10.5" fill="#0f172a">DynamoDB</text><text x="406" y="522">1 table</text>

    <rect x="462" y="488" width="92" height="46" rx="6" fill="#fdf2f8" stroke="#be185d" stroke-width="1.1"/>
    <text x="508" y="508" font-size="10.5" fill="#0f172a">DynamoDB</text><text x="508" y="522">1 table</text>

    <rect x="564" y="488" width="92" height="46" rx="6" fill="#fdf2f8" stroke="#be185d" stroke-width="1.1"/>
    <text x="610" y="508" font-size="10.5" fill="#0f172a">DynamoDB</text><text x="610" y="522">2 tables</text>

    <rect x="666" y="488" width="92" height="46" rx="6" fill="#fdf2f8" stroke="#be185d" stroke-width="1.1"/>
    <text x="712" y="508" font-size="10.5" fill="#0f172a">DynamoDB</text><text x="712" y="522">3 tables</text>
  </g>

  <line x1="406" y1="456" x2="406" y2="484" stroke="#64748b" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="508" y1="456" x2="508" y2="484" stroke="#64748b" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="610" y1="456" x2="610" y2="484" stroke="#64748b" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="712" y1="456" x2="712" y2="484" stroke="#64748b" stroke-width="1.1" marker-end="url(#arrow)"/>

  <!-- ── optional VPC note ───────────────────────────────────────────── -->
  <rect x="790" y="326" width="160" height="90" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="870" y="348" font-size="10.5" font-weight="600" text-anchor="middle" fill="#475569">Optional: VPC mode</text>
  <text x="870" y="366" font-size="9" text-anchor="middle" fill="#64748b">both runtimes on</text>
  <text x="870" y="379" font-size="9" text-anchor="middle" fill="#64748b">private subnets, with</text>
  <text x="870" y="392" font-size="9" text-anchor="middle" fill="#64748b">PrivateLink endpoints</text>
  <text x="870" y="407" font-size="9" text-anchor="middle" fill="#94a3b8">ENABLE_VPC=true</text>

  <!-- ── footnote ────────────────────────────────────────────────────── -->
  <text x="30" y="576" font-size="10.5" fill="#475569">Two kinds of question, two paths. "How many bolts are in stock?" is an exact lookup; "what is the receiving procedure?" is semantic search over</text>
  <text x="30" y="592" font-size="10.5" fill="#475569">documents. The orchestrator chooses between them by reading tool descriptions — the delegation tool's docstring is the routing logic.</text>

  <text x="30" y="624" font-size="9.5" fill="#94a3b8">Gateway target names contain no hyphens: the gateway composes tool names as &lt;target&gt;___&lt;tool&gt;, and Nova rejects a hyphen in a tool name.</text>
</svg>
